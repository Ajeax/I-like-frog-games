<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pong</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      color: white;
      font-family: Arial, sans-serif;
    }
    canvas {
      background: #111;
      display: block;
      margin: auto;
      max-width: 100%;
      height: auto;
    }
    #backBtn {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #backBtn:hover {
      background: #45a049;
    }
    /* Touch controls for mobile */
    .touch-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      opacity: 0; /* Invisible but clickable */
    }
    #leftZone { left: 0; }
    #rightZone { right: 0; }
  </style>
</head>
<body>
  <canvas id="pong" width="800" height="500"></canvas>
  <button id="backBtn" onclick="location.href='index.html'">Back to Menu</button>
  
  <!-- Invisible touch zones for mobile control -->
  <div id="leftZone" class="touch-zone"></div>
  <div id="rightZone" class="touch-zone"></div>

  <script>
    const canvas = document.getElementById("pong");
    const ctx = canvas.getContext("2d");

    // Game objects
    const paddleWidth = 10, paddleHeight = 100;
    let leftPaddle = { x: 10, y: canvas.height/2 - paddleHeight/2, dy: 0 };
    let rightPaddle = { x: canvas.width - paddleWidth - 10, y: canvas.height/2 - paddleHeight/2, dy: 0 };

    // Balls array (multi-ball madness)
    let balls = [{
      x: canvas.width/2, 
      y: canvas.height/2, 
      radius: 8, 
      speedX: 4, 
      speedY: 4
    }];

    // Scores
    let leftScore = 0;
    let rightScore = 0;

    let upPressed = false, downPressed = false;
    let wPressed = false, sPressed = false;

    // 🎵 Sound setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(frequency, duration=0.1, type="square") {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = frequency;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
    const sounds = {
      paddle: () => playSound(300, 0.1, "sine"),
      wall: () => playSound(200, 0.1, "triangle"),
      score: () => playSound(500, 0.2, "sawtooth")
    };

    // Drawing
    function drawRect(x, y, w, h, color="white") {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }
    function drawCircle(x, y, r, color="white") {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI*2);
      ctx.closePath();
      ctx.fill();
    }
    function drawNet() {
      for (let i = 0; i <= canvas.height; i += 20) {
        drawRect(canvas.width/2 - 1, i, 2, 10, "gray");
      }
    }
    function drawScore() {
      ctx.fillStyle = "white";
      ctx.font = "32px Arial";
      ctx.textAlign = "center";
      ctx.fillText(leftScore, canvas.width/4, 50);
      ctx.fillText(rightScore, 3*canvas.width/4, 50);
    }

    // Spawn a new ball in the center
    function spawnBall(direction = 1) {
      balls.push({
        x: canvas.width/2,
        y: canvas.height/2,
        radius: 8,
        speedX: 4 * direction,
        speedY: 4 * (Math.random() > 0.5 ? 1 : -1)
      });
    }

    // Update all game objects
    function update() {
      // Paddle movement
      if (wPressed) leftPaddle.dy = -5;
      else if (sPressed) leftPaddle.dy = 5;
      else leftPaddle.dy = 0;

      if (upPressed) rightPaddle.dy = -5;
      else if (downPressed) rightPaddle.dy = 5;
      else rightPaddle.dy = 0;

      leftPaddle.y += leftPaddle.dy;
      rightPaddle.y += rightPaddle.dy;

      leftPaddle.y = Math.max(0, Math.min(canvas.height - paddleHeight, leftPaddle.y));
      rightPaddle.y = Math.max(0, Math.min(canvas.height - paddleHeight, rightPaddle.y));

      // Update all balls
      for (let ball of balls) {
        ball.x += ball.speedX;
        ball.y += ball.speedY;

        // Bounce off top/bottom
        if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
          ball.speedY *= -1;
          sounds.wall();
        }

        // Paddle collisions
        if (ball.x - ball.radius < leftPaddle.x + paddleWidth &&
            ball.y > leftPaddle.y &&
            ball.y < leftPaddle.y + paddleHeight) {
          ball.speedX *= -1;
          ball.x = leftPaddle.x + paddleWidth + ball.radius;
          sounds.paddle();
        }
        if (ball.x + ball.radius > rightPaddle.x &&
            ball.y > rightPaddle.y &&
            ball.y < rightPaddle.y + paddleHeight) {
          ball.speedX *= -1;
          ball.x = rightPaddle.x - ball.radius;
          sounds.paddle();
        }
      }

      // Check scoring (loop backwards so we can remove safely)
      for (let i = balls.length - 1; i >= 0; i--) {
        let ball = balls[i];
        if (ball.x - ball.radius < 0) {
          rightScore++;
          sounds.score();
          balls.splice(i, 1);
          spawnBall(1);
          spawnBall(-1); // spawn two balls
        }
        else if (ball.x + ball.radius > canvas.width) {
          leftScore++;
          sounds.score();
          balls.splice(i, 1);
          spawnBall(1);
          spawnBall(-1); // spawn two balls
        }
      }

      // If no balls exist (edge case), respawn two
      if (balls.length === 0) {
        spawnBall(1);
        spawnBall(-1);
      }
    }

    // Draw everything
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawNet();
      drawScore();
      drawRect(leftPaddle.x, leftPaddle.y, paddleWidth, paddleHeight);
      drawRect(rightPaddle.x, rightPaddle.y, paddleWidth, paddleHeight);
      for (let ball of balls) {
        drawCircle(ball.x, ball.y, ball.radius);
      }
    }

    // Game loop
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();

    // Keyboard controls
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp") upPressed = true;
      if (e.key === "ArrowDown") downPressed = true;
      if (e.key === "w" || e.key === "W") wPressed = true;
      if (e.key === "s" || e.key === "S") sPressed = true;
      if (audioCtx.state === "suspended") audioCtx.resume();
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowUp") upPressed = false;
      if (e.key === "ArrowDown") downPressed = false;
      if (e.key === "w" || e.key === "W") wPressed = false;
      if (e.key === "s" || e.key === "S") sPressed = false;
    });

    // Mobile touch controls
    const leftZone = document.getElementById("leftZone");
    const rightZone = document.getElementById("rightZone");

    function handleTouch(zone, paddle) {
      zone.addEventListener("touchstart", (e) => {
        if (audioCtx.state === "suspended") audioCtx.resume();
        let touchY = e.touches[0].clientY;
        if (touchY < window.innerHeight/2) paddle.dy = -5;
        else paddle.dy = 5;
      });
      zone.addEventListener("touchend", () => {
        paddle.dy = 0;
      });
    }
    handleTouch(leftZone, leftPaddle);
    handleTouch(rightZone, rightPaddle);
  </script>
</body>
</html>
