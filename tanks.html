<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanks Clone</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #222;
      color: white;
      font-family: Arial, sans-serif;
    }
    canvas {
      background: #444;
      display: block;
      margin: 20px auto;
      border: 3px solid #fff;
    }
    #backBtn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #backBtn:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <canvas id="game" width="600" height="600"></canvas>
  <button id="backBtn" onclick="location.href='index.html'">Back to Menu</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // Tank/player
    const tank = {
      x: 100,
      y: 100,
      size: 30,
      angle: 0,
      speed: 2.5,
      rotationSpeed: 0.05
    };

    const keys = {};
    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => keys[e.key] = false);

    // Bullets
    let bullets = [];
    const bulletSpeed = 5;
    const maxBounces = 3;

    // Walls (simple rectangles)
    const walls = [
      {x: 200, y: 150, w: 200, h: 20},
      {x: 100, y: 300, w: 20, h: 200},
      {x: 400, y: 350, w: 150, h: 20},
      {x: 250, y: 450, w: 100, h: 20},
    ];

    function shoot() {
      const dx = Math.cos(tank.angle);
      const dy = Math.sin(tank.angle);
      bullets.push({
        x: tank.x + dx * tank.size/2,
        y: tank.y + dy * tank.size/2,
        dx: dx * bulletSpeed,
        dy: dy * bulletSpeed,
        bounces: 0
      });
    }

    document.addEventListener("keydown", e => {
      if (e.code === "Space") shoot();
    });

    function drawTank() {
      ctx.save();
      ctx.translate(tank.x, tank.y);
      ctx.rotate(tank.angle);
      ctx.fillStyle = "green";
      ctx.fillRect(-tank.size/2, -tank.size/2, tank.size, tank.size);
      ctx.fillStyle = "black";
      ctx.fillRect(0, -5, tank.size/2, 10); // barrel
      ctx.restore();
    }

    function drawWalls() {
      ctx.fillStyle = "#888";
      for (let w of walls) {
        ctx.fillRect(w.x, w.y, w.w, w.h);
      }
    }

    function drawBullets() {
      ctx.fillStyle = "yellow";
      for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI*2);
        ctx.fill();
      }
    }

    function updateTank() {
      if (keys["ArrowLeft"] || keys["a"]) tank.angle -= tank.rotationSpeed;
      if (keys["ArrowRight"] || keys["d"]) tank.angle += tank.rotationSpeed;

      let moveX = 0, moveY = 0;
      if (keys["ArrowUp"] || keys["w"]) {
        moveX = Math.cos(tank.angle) * tank.speed;
        moveY = Math.sin(tank.angle) * tank.speed;
      }
      if (keys["ArrowDown"] || keys["s"]) {
        moveX = -Math.cos(tank.angle) * tank.speed;
        moveY = -Math.sin(tank.angle) * tank.speed;
      }

      // Check wall collisions before moving
      let newX = tank.x + moveX;
      let newY = tank.y + moveY;
      const half = tank.size/2;

      if (!walls.some(w => 
        newX + half > w.x && newX - half < w.x + w.w &&
        newY + half > w.y && newY - half < w.y + w.h
      )) {
        tank.x = newX;
        tank.y = newY;
      }
    }

    function updateBullets() {
      for (let b of bullets) {
        b.x += b.dx;
        b.y += b.dy;

        // Bounce on canvas edges
        if (b.x < 0 || b.x > canvas.width) {
          b.dx *= -1;
          b.bounces++;
        }
        if (b.y < 0 || b.y > canvas.height) {
          b.dy *= -1;
          b.bounces++;
        }

        // Bounce on walls
        for (let w of walls) {
          if (b.x > w.x && b.x < w.x+w.w && b.y > w.y && b.y < w.y+w.h) {
            // Determine bounce direction
            if (b.x - b.dx < w.x || b.x - b.dx > w.x + w.w) b.dx *= -1;
            if (b.y - b.dy < w.y || b.y - b.dy > w.y + w.h) b.dy *= -1;
            b.bounces++;
          }
        }
      }
      // Remove bullets after too many bounces
      bullets = bullets.filter(b => b.bounces <= maxBounces);
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawWalls();
      updateTank();
      drawTank();
      updateBullets();
      drawBullets();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
</html>
