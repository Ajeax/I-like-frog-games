<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FPS Forest — Auto Start</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#081218; font-family:sans-serif; color:white; }
  #hud { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.4); padding:6px 10px; border-radius:8px; z-index:5; }
</style>
</head>
<body>
<div id="hud">Health: <span id="health">100</span> | Score: <span id="score">0</span></div>
<div id="container"></div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.154.0/build/three.module.js';
import { PointerLockControls } from 'https://unpkg.com/three@0.154.0/examples/jsm/controls/PointerLockControls.js';

/* --- setup --- */
const container = document.getElementById('container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x88ccee);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 2000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff,0x444444,0.6); scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff,0.6); dir.position.set(100,200,100); scene.add(dir);

const groundGeo = new THREE.PlaneGeometry(2000,2000);
groundGeo.rotateX(-Math.PI/2);
const ground = new THREE.Mesh(groundGeo, new THREE.MeshPhongMaterial({color:0x228822}));
scene.add(ground);

/* --- controls --- */
const controls = new PointerLockControls(camera, renderer.domElement);
scene.add(controls.getObject());

document.addEventListener('click', () => {
  renderer.domElement.requestPointerLock();
});

let move = {f:0,b:0,l:0,r:0}, canJump=false;
document.addEventListener('keydown', e=>{
  if(e.code==='KeyW') move.f=1;
  if(e.code==='KeyS') move.b=1;
  if(e.code==='KeyA') move.l=1;
  if(e.code==='KeyD') move.r=1;
  if(e.code==='Space' && canJump){ velocity.y=350; canJump=false; }
});
document.addEventListener('keyup', e=>{
  if(e.code==='KeyW') move.f=0;
  if(e.code==='KeyS') move.b=0;
  if(e.code==='KeyA') move.l=0;
  if(e.code==='KeyD') move.r=0;
});

/* --- player physics --- */
let velocity = new THREE.Vector3();
let prevTime = performance.now();

/* --- trees --- */
const treeGeo = new THREE.CylinderGeometry(5,5,40,8);
const treeMat = new THREE.MeshPhongMaterial({color:0x663300});
for(let i=0;i<50;i++){
  const trunk = new THREE.Mesh(treeGeo, treeMat);
  trunk.position.set((Math.random()-0.5)*1800,20,(Math.random()-0.5)*1800);
  scene.add(trunk);
  const leaves = new THREE.Mesh(new THREE.SphereGeometry(20,8,8), new THREE.MeshPhongMaterial({color:0x228844}));
  leaves.position.set(0,40,0);
  trunk.add(leaves);
}

/* --- animate --- */
function animate(){
  requestAnimationFrame(animate);
  const time = performance.now();
  const delta = (time-prevTime)/1000;

  velocity.x -= velocity.x*10.0*delta;
  velocity.z -= velocity.z*10.0*delta;
  velocity.y -= 9.8*100*delta;

  if(move.f) velocity.z -= 400*delta;
  if(move.b) velocity.z += 400*delta;
  if(move.l) velocity.x -= 400*delta;
  if(move.r) velocity.x += 400*delta;

  controls.moveRight(-velocity.x*delta);
  controls.moveForward(-velocity.z*delta);
  controls.getObject().position.y += (velocity.y*delta);

  if(controls.getObject().position.y<10){
    velocity.y=0;
    controls.getObject().position.y=10;
    canJump=true;
  }

  renderer.render(scene,camera);
  prevTime=time;
}
animate();

</script>
</body>
</html>
