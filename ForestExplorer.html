<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FPS Forest — Three.js Demo (Fixed Start)</title>
<style>
  html,body { height:100%; margin:0; background:#081218; font-family:system-ui,Segoe UI,Roboto,Arial; color:#fff; }
  #container { width:100%; height:100%; overflow:hidden; position:relative; }
  canvas { display:block; }
  #hud { position:absolute; left:12px; top:12px; background:rgba(0,0,0,0.45); padding:10px 12px; border-radius:8px; font-size:14px; z-index:10; }
  #minimap { position:absolute; right:12px; top:12px; width:200px; height:200px; background:rgba(0,0,0,0.45); border-radius:8px; padding:6px; z-index:10; }
  #minimap canvas { background:#0b2b0b; width:100%; height:100%; display:block; border-radius:6px; }
  #instructions { position:absolute; left:12px; bottom:12px; background:rgba(0,0,0,0.3); padding:8px 12px; border-radius:8px; font-size:13px; z-index:10; }
  #overlay { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.7); padding:18px 22px; border-radius:10px; display:flex; gap:8px; align-items:center; flex-direction:column; z-index:20; }
  #startBtn { padding:10px 14px; border-radius:8px; background:#3ea; border:none; font-weight:700; color:#012; cursor:pointer; }
  #stats { display:flex; gap:12px; }
  @media (max-width:700px) { #minimap { display:none; } }
</style>
</head>
<body>
<div id="container"></div>

<div id="hud">
  <div>Health: <span id="health">100</span></div>
  <div>Score: <span id="score">0</span></div>
</div>

<div id="minimap">
  <canvas id="miniCanvas" width="200" height="200"></canvas>
</div>

<div id="instructions">WASD to move • Mouse to look (click to lock) • Space to jump • Collect orbs • Avoid enemies</div>

<div id="overlay">
  <div style="font-size:18px; font-weight:700">FPS Forest — Three.js Demo</div>
  <div style="font-size:13px; color:#ddd">Click Start, then click the scene to lock the mouse and play.</div>
  <div id="stats"> <div>Trees: <span id="treeCount">0</span></div> <div>Enemies: <span id="enemyCount">0</span></div> </div>
  <button id="startBtn">Start</button>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.154.0/build/three.module.js';
import { PointerLockControls } from 'https://unpkg.com/three@0.154.0/examples/jsm/controls/PointerLockControls.js';

/* -------------------------
   Configuration
   ------------------------- */
const CONFIG = {
  worldSize: 1600,
  treeCount: 240,
  minTreeDistance: 80,
  collectibleCount: 14,
  enemyCountStart: 3,
  enemySpawnIntervalMs: 8000,
  playerHeight: 18,
  playerSpeed: 220,
  jumpVelocity: 360,
  gravity: -900,
  treeRadiusRange: [14, 36],
  collisionRadiusPlayer: 10,
  collisionRadiusEnemy: 12
};

/* -------------------------
   UI elements
   ------------------------- */
const container = document.getElementById('container');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const healthEl = document.getElementById('health');
const scoreEl = document.getElementById('score');
const treeCountEl = document.getElementById('treeCount');
const enemyCountEl = document.getElementById('enemyCount');
const miniCanvas = document.getElementById('miniCanvas');
const miniCtx = miniCanvas.getContext('2d');

/* -------------------------
   Three.js setup
   ------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x88c3ff);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 4000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);
window.addEventListener('resize', ()=> {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* lights */
const hemi = new THREE.HemisphereLight(0xbfd1ff, 0x444444, 0.9); scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 0.55); dir.position.set(500,600,200); scene.add(dir);

/* ground */
const groundGeo = new THREE.PlaneGeometry(CONFIG.worldSize, CONFIG.worldSize, 32, 32);
groundGeo.rotateX(-Math.PI/2);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x2b5b2b, roughness: 1 });
const ground = new THREE.Mesh(groundGeo, groundMat);
scene.add(ground);

/* controls (pointer lock) */
const controls = new PointerLockControls(camera, renderer.domElement);
scene.add(controls.getObject());     // attach control object to scene
controls.connect();                  // enable connect so moveForward / moveRight work

/* -------------------------
   Player state
   ------------------------- */
let player = {
  x: 0, y: CONFIG.playerHeight, z: 0,
  velY: 0, grounded: true,
  health: 100, score: 0
};
camera.position.set(player.x, player.y, player.z);

/* keyboard */
const keyState = {};
window.addEventListener('keydown', e => { keyState[e.key.toLowerCase()] = true; if(e.code === 'Space') tryJump(); });
window.addEventListener('keyup', e => { keyState[e.key.toLowerCase()] = false; });

function tryJump(){
  if(player.grounded){
    player.velY = CONFIG.jumpVelocity;
    player.grounded = false;
    footstep(false);
  }
}

/* -------------------------
   Scene content containers
   ------------------------- */
const treeCollision = [];  // {x,z,r}
const collectibles = [];   // {mesh, x,z, collected}
const enemies = [];        // {mesh, ...}

/* -------------------------
   Audio - basic tones (no external files)
   ------------------------- */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioCtx();

// ambient low pad
const pad = audioCtx.createOscillator();
const padGain = audioCtx.createGain();
pad.type = 'sine'; pad.frequency.value = 120; padGain.gain.value = 0.0015;
pad.connect(padGain); padGain.connect(audioCtx.destination); pad.start();

function birdChirp(){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'triangle'; o.frequency.value = 700 + Math.random()*900;
  g.gain.value = 0.0;
  o.connect(g); g.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.02, now + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
  o.start(now); o.stop(now + 0.45);
  setTimeout(birdChirp, 800 + Math.random()*3000);
}
function startAudio(){
  if(audioCtx.state === 'suspended') audioCtx.resume();
  birdChirp();
}

let lastStepTime = 0;
function footstep(move=true){
  const now = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; o.frequency.value = move ? 180 : 120;
  g.gain.value = 0.0001;
  o.connect(g); g.connect(audioCtx.destination);
  const t0 = now;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(move?0.01:0.005, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.12);
  o.start(t0); o.stop(t0+0.15);
}

/* -------------------------
   Helpers: create tree, collectible, enemy
   ------------------------- */
function createTree(x,z, leafRadius, trunkHeight){
  const trunkGeo = new THREE.CylinderGeometry(trunkHeight*0.12, trunkHeight*0.12, trunkHeight, 8);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b3f2b });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.set(x, trunkHeight/2, z);

  const leavesGeo = new THREE.SphereGeometry(leafRadius, 10, 8);
  const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2c8b3a, flatShading:true });
  const leaves = new THREE.Mesh(leavesGeo, leavesMat);
  leaves.position.set(0, trunkHeight*0.8, 0);
  trunk.add(leaves);

  scene.add(trunk);
  return {root:trunk, leaves:leaves};
}
function createCollectible(x,z){
  const geo = new THREE.SphereGeometry(6,12,12);
  const mat = new THREE.MeshStandardMaterial({ color: 0xffd46f, emissive:0x8b5f1a, metalness:0.5, roughness:0.2 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, 8, z);
  scene.add(mesh);
  return {mesh,x,z, collected:false};
}
function createEnemy(x,z){
  const geo = new THREE.CapsuleGeometry(8, 10, 6, 10);
  const mat = new THREE.MeshStandardMaterial({ color: 0xcc4444 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, 10, z);
  scene.add(mesh);
  return {mesh, state:'wander', tx: x, tz: z, targetTimer: 0, lastDamage: 0};
}

/* -------------------------
   Populate world: trees, collectibles, enemies
   ------------------------- */
function randomInRange(min,max){ return Math.random()*(max-min)+min; }
for(let i=0;i<CONFIG.treeCount;i++){
  let x,z;
  do{
    x = randomInRange(-CONFIG.worldSize/2, CONFIG.worldSize/2);
    z = randomInRange(-CONFIG.worldSize/2, CONFIG.worldSize/2);
  } while(Math.hypot(x,z) < CONFIG.minTreeDistance);
  const leafRadius = randomInRange(CONFIG.treeRadiusRange[0], CONFIG.treeRadiusRange[1]);
  const trunkH = randomInRange(30, 80);
  createTree(x,z, leafRadius, trunkH);
  treeCollision.push({x,z,r: leafRadius});
}
treeCountEl.textContent = treeCollision.length;

for(let i=0;i<CONFIG.collectibleCount;i++){
  let x,z;
  do {
    x = randomInRange(-CONFIG.worldSize/2 + 40, CONFIG.worldSize/2 - 40);
    z = randomInRange(-CONFIG.worldSize/2 + 40, CONFIG.worldSize/2 - 40);
  } while(Math.hypot(x,z) < CONFIG.minTreeDistance);
  collectibles.push(createCollectible(x,z));
}

for(let i=0;i<CONFIG.enemyCountStart;i++){
  let x = randomInRange(-CONFIG.worldSize/2 + 60, CONFIG.worldSize/2 - 60);
  let z = randomInRange(-CONFIG.worldSize/2 + 60, CONFIG.worldSize/2 - 60);
  enemies.push(createEnemy(x,z));
}
enemyCountEl.textContent = enemies.length;

/* -------------------------
   Minimap drawing
   ------------------------- */
function drawMinimap(){
  const cw = miniCanvas.width, ch = miniCanvas.height;
  miniCtx.clearRect(0,0,cw,ch);
  miniCtx.fillStyle = '#062006'; miniCtx.fillRect(0,0,cw,ch);
  const scale = cw / CONFIG.worldSize;
  const cx = cw/2, cy = ch/2;
  // trees
  miniCtx.fillStyle = '#2b8b2b';
  for(const t of treeCollision){
    const sx = cx + t.x * scale;
    const sy = cy + t.z * scale;
    miniCtx.beginPath(); miniCtx.arc(sx, sy, Math.max(2, t.r*scale*0.6), 0, Math.PI*2); miniCtx.fill();
  }
  // collectibles
  miniCtx.fillStyle = '#ffd46f';
  for(const c of collectibles){
    if(c.collected) continue;
    const sx = cx + c.x * scale, sy = cy + c.z * scale;
    miniCtx.beginPath(); miniCtx.arc(sx, sy, 3, 0, Math.PI*2); miniCtx.fill();
  }
  // enemies
  miniCtx.fillStyle = '#ff5555';
  for(const e of enemies){
    const sx = cx + e.mesh.position.x * scale, sy = cy + e.mesh.position.z * scale;
    miniCtx.beginPath(); miniCtx.arc(sx, sy, 4, 0, Math.PI*2); miniCtx.fill();
  }
  // player
  miniCtx.fillStyle = '#66ffcc';
  const px = cx + player.x * scale, pz = cy + player.z * scale;
  miniCtx.beginPath(); miniCtx.arc(px, pz, 5, 0, Math.PI*2); miniCtx.fill();
}

/* -------------------------
   Collision resolution (trees & enemies & bounds)
   ------------------------- */
function resolveCollisions(){
  // tree collisions (push player out)
  for(const t of treeCollision){
    const dx = player.x - t.x, dz = player.z - t.z;
    const dist = Math.hypot(dx,dz);
    const minDist = CONFIG.collisionRadiusPlayer + t.r*0.6;
    if(dist < minDist && dist > 0.0001){
      const overlap = (minDist - dist);
      const nx = dx / dist, nz = dz / dist;
      player.x += nx * overlap;
      player.z += nz * overlap;
    }
  }
  // enemies push
  for(const e of enemies){
    const dx = player.x - e.mesh.position.x, dz = player.z - e.mesh.position.z;
    const dist = Math.hypot(dx,dz);
    const minDist = CONFIG.collisionRadiusPlayer + CONFIG.collisionRadiusEnemy;
    if(dist < minDist && dist > 0.0001){
      const overlap = (minDist - dist);
      const nx = dx / dist, nz = dz / dist;
      player.x += nx * overlap * 0.5;
      player.z += nz * overlap * 0.5;
    }
  }
  // bounds
  const bound = CONFIG.worldSize/2 - 20;
  player.x = Math.max(-bound, Math.min(bound, player.x));
  player.z = Math.max(-bound, Math.min(bound, player.z));
}

/* -------------------------
   Enemy AI (wander / chase) + damage
   ------------------------- */
function updateEnemies(dt){
  for(const e of enemies){
    if(Math.random() < 0.004) e.state = (Math.random()<0.6)?'wander':'chase';
    if(e.state === 'wander'){
      if(e.targetTimer <= 0){
        e.tx = e.mesh.position.x + randomInRange(-120,120);
        e.tz = e.mesh.position.z + randomInRange(-120,120);
        e.targetTimer = 40 + Math.random()*160;
      } else e.targetTimer--;
    } else {
      e.tx = player.x; e.tz = player.z;
    }
    // steering toward target
    const dx = e.tx - e.mesh.position.x, dz = e.tz - e.mesh.position.z;
    const dist = Math.hypot(dx,dz);
    if(dist > 2){
      let speed = 30; // per second
      let nx = e.mesh.position.x + (dx/dist) * speed * dt;
      let nz = e.mesh.position.z + (dz/dist) * speed * dt;
      // simple tree avoidance: if next spot collides with tree, nudge randomly
      let collide = false;
      for(const t of treeCollision){
        if(Math.hypot(nx - t.x, nz - t.z) < t.r*0.6 + CONFIG.collisionRadiusEnemy + 6){ collide = true; break; }
      }
      if(!collide){ e.mesh.position.x = nx; e.mesh.position.z = nz; }
      else { e.mesh.position.x += Math.cos(Math.random()*Math.PI*2) * 8 * dt; e.mesh.position.z += Math.sin(Math.random()*Math.PI*2) * 8 * dt; }
      // orient
      e.mesh.lookAt(player.x, e.mesh.position.y, player.z);
    }
    // contact damage with cooldown
    const pdx = player.x - e.mesh.position.x, pdz = player.z - e.mesh.position.z;
    if(Math.hypot(pdx,pdz) < 14){
      if(!e.lastDamage || (performance.now() - e.lastDamage) > 900){
        player.health -= 8;
        e.lastDamage = performance.now();
        updateHUD();
        if(player.health <= 0) onPlayerDeath();
      }
    }
  }
}

/* -------------------------
   Check collectibles
   ------------------------- */
function checkCollectibles(){
  for(const c of collectibles){
    if(c.collected) continue;
    const dx = player.x - c.x, dz = player.z - c.z;
    if(Math.hypot(dx,dz) < 16){
      c.collected = true;
      scene.remove(c.mesh);
      player.score += 1;
      updateHUD();
      // pleasant tone
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type='sine'; o.frequency.value = 880; g.gain.value = 0.02;
      o.connect(g); g.connect(audioCtx.destination); const now = audioCtx.currentTime;
      g.gain.setValueAtTime(0.02, now); g.gain.exponentialRampToValueAtTime(0.0001, now+0.15);
      o.start(now); o.stop(now+0.15);
    }
  }
}

/* -------------------------
   HUD / player death
   ------------------------- */
function updateHUD(){
  healthEl.textContent = Math.max(0, Math.floor(player.health));
  scoreEl.textContent = player.score;
}
function onPlayerDeath(){
  overlay.querySelector('div').textContent = 'You died — Score: ' + player.score;
  overlay.style.display = 'flex';
  controls.unlock();
}

/* -------------------------
   Spawn objects we created earlier but deferred for readability
   ------------------------- */
(function populateWorld(){
  // Trees
  for(let i=0;i<CONFIG.treeCount;i++){
    let x,z;
    do{
      x = randomInRange(-CONFIG.worldSize/2, CONFIG.worldSize/2);
      z = randomInRange(-CONFIG.worldSize/2, CONFIG.worldSize/2);
    } while(Math.hypot(x,z) < CONFIG.minTreeDistance);
    const leafRadius = randomInRange(CONFIG.treeRadiusRange[0], CONFIG.treeRadiusRange[1]);
    const trunkH = randomInRange(30, 80);
    createTree(x,z, leafRadius, trunkH);
    treeCollision.push({x,z,r: leafRadius});
  }
  treeCountEl.textContent = treeCollision.length;
  // collectibles
  for(let i=0;i<CONFIG.collectibleCount;i++){
    let x,z;
    do {
      x = randomInRange(-CONFIG.worldSize/2 + 40, CONFIG.worldSize/2 - 40);
      z = randomInRange(-CONFIG.worldSize/2 + 40, CONFIG.worldSize/2 - 40);
    } while(Math.hypot(x,z) < CONFIG.minTreeDistance);
    collectibles.push(createCollectible(x,z));
  }
  // initial enemies
  for(let i=0;i<CONFIG.enemyCountStart;i++){
    let x = randomInRange(-CONFIG.worldSize/2 + 60, CONFIG.worldSize/2 - 60);
    let z = randomInRange(-CONFIG.worldSize/2 + 60, CONFIG.worldSize/2 - 60);
    enemies.push(createEnemy(x,z));
  }
  enemyCountEl.textContent = enemies.length;
})();

/* -------------------------
   Start button & pointer lock fix (RESUME AUDIO + CONNECT CONTROLS)
   ------------------------- */
startBtn.addEventListener('click', ()=>{
  overlay.style.display = 'none';
  // ensure audio context resumes on user gesture
  if(audioCtx.state === 'suspended') audioCtx.resume();
  startAudio();
  // request pointer lock on the renderer element (canvas)
  renderer.domElement.requestPointerLock();
  // also attach a one-time click to focus controls if needed
  renderer.domElement.addEventListener('click', ()=> {
    if(document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock();
  }, {once:true});
});

/* react to pointer lock changes */
document.addEventListener('pointerlockchange', ()=>{
  if(document.pointerLockElement === renderer.domElement){
    controls.lock();
  } else {
    controls.unlock();
  }
});

/* -------------------------
   Main loop
   ------------------------- */
let prevTime = performance.now();
let lastEnemySpawn = performance.now();

function animate(){
  const now = performance.now();
  const dt = Math.min(0.06, (now - prevTime)/1000);
  prevTime = now;

  // movement input
  const forward = (keyState['w'] || keyState['arrowup']) ? 1 : 0;
  const back = (keyState['s'] || keyState['arrowdown']) ? 1 : 0;
  const left = (keyState['a'] || keyState['arrowleft']) ? 1 : 0;
  const right = (keyState['d'] || keyState['arrowright']) ? 1 : 0;
  let mvX = right - left;
  let mvZ = forward - back;

  // camera orientation via controls.getObject().rotation/yaw
  const camQuat = camera.quaternion;
  const forwardVec = new THREE.Vector3(0,0,-1).applyQuaternion(camQuat); forwardVec.y = 0; forwardVec.normalize();
  const rightVec = new THREE.Vector3(1,0,0).applyQuaternion(camQuat); rightVec.y = 0; rightVec.normalize();

  // velocity
  let vx = (forwardVec.x * mvZ + rightVec.x * mvX) * CONFIG.playerSpeed;
  let vz = (forwardVec.z * mvZ + rightVec.z * mvX) * CONFIG.playerSpeed;
  if(mvX !== 0 && mvZ !== 0){ vx *= 0.7071; vz *= 0.7071; }

  // apply movement immediately (no sliding)
  player.x += vx * dt;
  player.z += vz * dt;

  // footstep sound
  if(player.grounded && Math.abs(vx)+Math.abs(vz) > 0.01){
    const nowAudio = audioCtx.currentTime;
    if(nowAudio - lastStepTime > 0.28){ footstep(true); lastStepTime = nowAudio; }
  }

  // gravity & vertical movement
  player.velY += CONFIG.gravity * dt;
  player.y += player.velY * dt;
  const groundH = 0 + Math.sin(player.x*0.001)*6 + Math.cos(player.z*0.001)*4;
  const standY = groundH + CONFIG.playerHeight;
  if(player.y <= standY){
    player.y = standY; player.velY = 0; player.grounded = true;
  } else player.grounded = false;

  // collision resolution + bounds
  resolveCollisions();

  // set camera / controls object position
  const ctrlObj = controls.getObject();
  ctrlObj.position.set(player.x, player.y, player.z);
  // required so camera quaternion reflects pointer look (PointerLockControls handles rotation)

  // update enemies & collectibles
  updateEnemies(dt);
  checkCollectibles();

  // spawn occasional enemies
  if(performance.now() - lastEnemySpawn > CONFIG.enemySpawnIntervalMs){
    if(enemies.length < 10 && Math.random() < 0.6){
      const ex = randomInRange(-CONFIG.worldSize/2+80, CONFIG.worldSize/2-80);
      const ez = randomInRange(-CONFIG.worldSize/2+80, CONFIG.worldSize/2-80);
      enemies.push(createEnemy(ex, ez));
    }
    lastEnemySpawn = performance.now();
  }
  enemyCountEl.textContent = enemies.length;

  // minimap + HUD
  drawMinimap();
  updateHUD();

  // render
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* -------------------------
   Utility helpers
   ------------------------- */
function createTree(x,z, leafRadius, trunkHeight){
  const trunkGeo = new THREE.CylinderGeometry(trunkHeight*0.12, trunkHeight*0.12, trunkHeight, 8);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b3f2b });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.set(x, trunkHeight/2, z);

  const leavesGeo = new THREE.SphereGeometry(leafRadius, 10, 8);
  const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2c8b3a, flatShading:true });
  const leaves = new THREE.Mesh(leavesGeo, leavesMat);
  leaves.position.set(0, trunkHeight*0.8, 0);
  trunk.add(leaves);

  scene.add(trunk);
  return {root:trunk, leaves:leaves};
}
function createCollectible(x,z){
  const geo = new THREE.SphereGeometry(6,12,12);
  const mat = new THREE.MeshStandardMaterial({ color: 0xffd46f, emissive:0x8b5f1a, metalness:0.5, roughness:0.2 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, 8, z);
  scene.add(mesh);
  return {mesh,x,z,collected:false};
}
function createEnemy(x,z){
  const geo = new THREE.CapsuleGeometry(8, 10, 6, 10);
  const mat = new THREE.MeshStandardMaterial({ color: 0xcc4444 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, 10, z);
  scene.add(mesh);
  return {mesh, state:'wander', tx:x, tz:z, targetTimer:0, lastDamage:0};
}
function randomInRange(min,max){ return Math.random()*(max-min)+min; }

/* -------------------------
   Init earlier-created utility functions (we used createTree above for population)
   but ensure we have at least the ones referenced */
function createTree(x,z, leafRadius, trunkHeight){
  const trunkGeo = new THREE.CylinderGeometry(trunkHeight*0.12, trunkHeight*0.12, trunkHeight, 8);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b3f2b });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.set(x, trunkHeight/2, z);

  const leavesGeo = new THREE.SphereGeometry(leafRadius, 10, 8);
  const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2c8b3a, flatShading:true });
  const leaves = new THREE.Mesh(leavesGeo, leavesMat);
  leaves.position.set(0, trunkHeight*0.8, 0);
  trunk.add(leaves);
  scene.add(trunk);
  return {root:trunk, leaves};
}
